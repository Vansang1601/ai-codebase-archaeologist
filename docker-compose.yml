services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: archaeo
      POSTGRES_PASSWORD: archaeo
      POSTGRES_DB: archaeo
    ports: ["5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build: ./backend
    env_file: .env
    depends_on: [db, redis]
    ports: ["8000:8000"]
  parser-worker:
    build: ./parser-worker
    env_file: .env
    depends_on: [db, redis]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  dbdata:
